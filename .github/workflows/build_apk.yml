name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get
        working-directory: src

      - name: Build Release APK
        # Backend config is injected at build time via --dart-define.
        # Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in
        # Repo Settings > Secrets and variables > Actions, otherwise the
        # app builds without a backend and auth/services fail at runtime.
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        working-directory: src

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: klear-app-release
          path: src/build/app/outputs/flutter-apk/app-release.apk
